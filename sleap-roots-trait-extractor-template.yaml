apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: sleap-roots-trait-extractor-template
  labels:
    project: busch-lab
  annotations:
    preemptible: "true"
spec:
  templates:
    - name: trait-extractor
      # Run preemptible for consistency with the predictor + to dodge a CPU-pool
      # NonPreemptibleOverQuota stall; the `preemptible` annotation above is inert.
      priorityClassName: interactive-preemptible
      retryStrategy:
        # sleap-roots#259 is RESOLVED, on both sides, as of #56:
        #  - driver half (sleap-roots#266, merged 2026-08-21): the driver now exits 0/3/1/143, and
        #    the empty-input hole is closed. The previous note here — "an empty /in exits 0
        #    (silent-green node)" — is no longer true: an empty input dir exits 1 with no manifest,
        #    or 3 with one (every manifest-declared scan_key with no matching file is a per-scan
        #    failure). #266 also added the SIGTERM handler this note used to say was missing.
        #  - Argo half (#56, this change): exit 3 no longer retries-then-kills the whole DAG. The
        #    `continueOn` on this task in sleap-roots-pipeline.yaml lets the DAG proceed, and the
        #    terminal exit-gate re-derives the Workflow phase from the real exit codes.
        # These limits are deliberately UNCHANGED and carry no retryStrategy.expression. Argo's
        # whole-step retry is currently the only scan-level retry that exists anywhere in the
        # producers (MAX_SCAN_ATTEMPTS is unimplemented in every repo), and skip-if-done here is
        # idempotency-key-based, so a retry re-attempts only the scans that actually failed.
        # Suppressing retries on exit 3 would permanently isolate a scan a second attempt would
        # have completed. See docs/superpowers/specs/2026-09-15-partial-success-exit-code-wiring-design.md.
        limit: 2
        retryPolicy: Always
      container:
        # A4: GHCR trait-extractor (sleap-roots #257, merged main bb2199c). ENTRYPOINT is
        # ["python","-m","trait_extractor"] (exec form) → args are the two dirs only, no `command:`.
        # Bakes SRT_TRAITS_CODE_SHA → non-empty traits_code_sha (idempotency-key input).
        # Bumped 2026-09-10 (#52/#55): the previous pin (bb2199c, 2026-07-06 — this image's very
        # first GHCR publish, never bumped since) predated manifest-scoped discovery + skip-if-done
        # (sleap-roots#263, merged 08-17) and the a7 contract_version re-pin (bloom#685, resolved
        # 2026-09-08) by weeks. Confirmed causing real leftover-scan contamination live
        # (2026-09-01 batch-oracle testing).
        # Digest-pinned 2026-09-16 (#70), for the same reason as the predictor template: the tag
        # names a commit, only the digest names bytes, and a `sha-<gitsha>` tag can be silently
        # overwritten by a rebuild of the same commit. This digest is the source of truth for
        # SRT_TRAITS_CONTAINER_DIGEST in `env:`; `scripts/check_manifests.py` fails if they drift.
        # Bumped 2026-09-28 (bloom#895 step 2, sleap-roots#269/srp#71): Bloom PR #903 re-pinned
        # `insert_cyl_result_envelope` to `contract_version = 0.1.0a9` and pulled EXECUTE from
        # anon/authenticated; a7-emitting envelopes are rejected as of that PR's staging apply.
        # This image emits a9 envelopes. Only the contracts pin changed vs. sha-689cffb — the
        # `sleap_roots` trait library itself is unchanged — so recomputed values should be
        # identical to the a7 ones.
        # Verified against GHCR: resolves to org.opencontainers.image.revision e373b0f…
        image: ghcr.io/talmolab/sleap-roots-trait-extractor:sha-e373b0f@sha256:2cbbe602b7d397b89c4eab326d00f410f367f8c1b7fba46a927a369fcf6fc9a4
        imagePullPolicy: Always
        args:
          - "/workspace/input"
          - "/workspace/output"
        env:
          # #56: NOT inert as of the 2026-09-28 bump to sha-e373b0f (sleap-roots#269, srp#71) —
          # trait_extractor now reads the per-run `run_manifest.<pipeline_run_id>.json`, deriving
          # pipeline_run_id from this (stripped) env var, and falls back to the legacy
          # `run_manifest.json` only when no per-run manifest exists (allow_legacy=True). Carried
          # for the same reason as the predictor template: the stage directories are fixed, shared
          # hostPaths that every run (and every environment) writes into, so an unscoped manifest
          # may belong to a different run. See sleap-roots-pipeline#56 and #82 (the
          # allow_legacy=False hardening -- closed won't-fix 2026-10-01: the stale legacy files were
          # deleted 2026-09-29, so the fallback already fails loud; see the roadmap's row 7).
          - name: ARGO_WORKFLOW_NAME
            value: "{{workflow.name}}"
          # #70: NOT inert -- trait_extractor reads this today (`trait_extractor/envelope.py`,
          # _resolve_identity(..., "SRT_TRAITS_CONTAINER_DIGEST")), falling back to "" when unset.
          # The value MUST equal the digest pinned on this file's own `image:` line;
          # check_manifests.py enforces that, parsing the expected value out of that line.
          # At every future pin bump, re-verify against the registry before editing either line:
          #   TOK=$(curl -s "https://ghcr.io/token?scope=repository:talmolab/sleap-roots-trait-extractor:pull&service=ghcr.io" | python -c 'import sys,json;print(json.load(sys.stdin)["token"])')
          #   curl -sI -H "Authorization: Bearer $TOK" -H "Accept: application/vnd.oci.image.index.v1+json" \
          #     https://ghcr.io/v2/talmolab/sleap-roots-trait-extractor/manifests/<tag> | grep -i docker-content-digest
          # Only the traits digest belongs here: predict_container_digest reaches this stage's
          # envelope threaded through predict's own manifest, so setting SRP_* here would fabricate
          # rather than record. Not an idempotency-key input, so changing it forces no recompute.
          - name: SRT_TRAITS_CONTAINER_DIGEST
            value: "sha256:2cbbe602b7d397b89c4eab326d00f410f367f8c1b7fba46a927a369fcf6fc9a4"
        volumeMounts:
          - name: predictions-output-dir
            mountPath: /workspace/input
          - name: traits-output-dir
            mountPath: /workspace/output
        securityContext:
          # TODO: privileged:true is unnecessary for a CPU-only Python process — verify + drop.
          privileged: true
          runAsUser: 0
        resources:
          # Initial estimates — tune from a real run.
          requests:
            cpu: "1"
            memory: 2Gi
          limits:
            cpu: "4"
            memory: 8Gi
