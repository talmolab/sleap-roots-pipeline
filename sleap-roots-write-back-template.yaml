# https://argo-workflows.readthedocs.io/en/latest/fields/#workflowspec
# A4: batch write-back via bloomctl (bloom #532). Same image-pin rationale (including the
# tag-mutability caveat) as sleap-roots-images-downloader-template.yaml.
# Bumped 2026-07-30: sha-61959bd (#532) -> sha-c21d11b (bloom #556, fixes #555 — see
# sleap-roots-images-downloader-template.yaml for details).
# Bumped 2026-09-15 (#56): sha-3659705 -> sha-0614889, same build as images-downloader. Not just
# for consistency — bloom#774 changed THIS stage's code (`cyl/ingest.py`, `cyl/_batch.py`), adding
# the per-scan status marking (`fail_cyl_pipeline_run_scans_without_result`, keyed on
# ARGO_WORKFLOW_NAME) that records an isolated-failed scan as `failed`. Without this bump the
# poison scan would stay `queued` and the run's failed_count would never move.
# Known gap, deferred: a manifest scan_key with no result is built as a *retriable* failure
# (ScanResult's `retriable` defaults True), so `needs_retry` fires and this stage exits 1. That
# does not affect a partial images-downloader — write_run_manifest excludes failed scans, so the
# poison scan never enters the manifest — but a partial predict/traits will fail the Workflow here.
# Tracked as bloom#859.
# Bumped 2026-09-17 (#79): sha-0614889 -> sha-28034f6 (salk-bloom #871, merge commit 28034f6d).
# Digest sha256:ee39fd04a250ee533bde24248dfa2b28cd4a23bd0a89614c462d3f11e40d0a7d. This bump changes
# THIS stage's code (`cyl/ingest.py`, `cyl/_batch.py`): `batch-ingest-result` now checks the
# idempotency gate (`source_already_ingested`) immediately before `upload_pending_blobs`, so
# re-delivering an envelope at an unchanged idempotency key skips an upload the RPC's
# `ON CONFLICT (idempotency_key) DO NOTHING` would discard anyway. Before it, the strict
# refuse-to-overwrite blob check ran first and failed the stage, because predict's `.slp` output is
# not byte-reproducible — identical inputs give an identical key but different bytes at the same
# address (srp#76, still OPEN pending live verification here).
# Caveat, load-bearing: the gate FAILS OPEN. If its `cyl_trait_sources` read grant is missing the
# check cannot be answered, the stage falls back to the old unguarded upload-then-RPC path, and
# srp#76 returns. #871 surfaces that as a per-scan `warning` in both the summary and the JSON
# report specifically because the log sink it would otherwise go to is unreadable under Argo — so
# treat a `WARNING <scan_key>:` line in this stage's output as "the fix is not in effect".
# Bumped 2026-09-29: sha-28034f6 -> sha-1bc3056@sha256:8e9eb22c7cd0ed5f3af45d7393463d3261699032dd8bb8aa4f1899ede250d802
# (salk-bloom #940, squash 1bc3056c; see sleap-roots-images-downloader-template.yaml). THIS stage's
# code changes: `batch-ingest-result` reads the run manifest via
# `load_run_manifest(dir, pipeline_run_id_from_env(), allow_legacy=True)`, which accepts a legacy
# `run_manifest.json` only when its pipeline_run_id equals this run. With a run id set and no
# manifest for this run, it ingests nothing, reconciles this workflow's queued scans to 'failed'
# ("write-back found no run manifest ... re-dispatch the run"), prints a `<run-manifest>` entry and
# exits 1. One stripped run id feeds the manifest lookup, p_argo_workflow_name and the reconcile
# call; a blank value counts as unset. Also carried, first live run here: bloom #880's
# cross-workflow redelivery status fallback.
# ORDERING: register THIS template before images-downloader's matching bump (the old writer stamps
# its own workflow name, so new-reader/old-writer is safe; the reverse is not).
# Bumped 2026-10-02: sha-1bc3056 -> sha-88cbcbf@sha256:0259ec0ad3c6a1cea927a7b28cfc6f20aad42919e43fe4d2767f6430607e3265
# (salk-bloom #1008, squash 88cbcbf3, bloomctl 0.1.0a7; part of bloom#900 / bloom#875; see
# sleap-roots-images-downloader-template.yaml for the ride-along commits). THIS stage's code
# changes, in its message only: an already-ingested envelope whose re-delivery did not update this
# workflow's cyl_pipeline_run_scans row (`was_noop: true`, `status_update_matched: false`) now
# reports "already ingested as source_id=N: nothing was written, and this workflow's ... row for
# that source's scan was not updated". It used to reuse the written-delivery text ("write-back
# succeeded ... the written trait/blob data is correct"). The outcome is unchanged: `failed`,
# non-retriable, and no change to the exit code. Most no-op re-deliveries now resolve
# server-side and report `skipped` (bloom #1001's RPC, live on staging since 2026-10-01), so this
# message appears only for the residual case.
# Rollback target: sha-1bc3056@sha256:8e9eb22c7cd0ed5f3af45d7393463d3261699032dd8bb8aa4f1899ede250d802.
# Bumped 2026-10-04: sha-88cbcbf -> sha-5b709d0@sha256:f2c2fb412a4a6ee48477e0b89f762dea70b8ad51f78c367f51cbd218c957e640
# (salk-bloom #1038, squash 5b709d0b, bloomctl 0.1.0a8; part of bloom#1034; see
# sleap-roots-images-downloader-template.yaml for the ride-along commit). THIS stage's code
# changes: when an envelope fails retriably, `cyl batch-ingest-result` no longer closes this
# workflow's still-`queued` scans as `failed` at the end of the attempt. It leaves them to Bloom's
# status poller and says so on stderr ("reconciliation deferred"). A scan that Argo's retry of this
# step then ingests ends `written`, instead of staying `failed` with its data written (prod run 2).
# The poller half shipped first: prod's workflows service runs bloom #1038 since the 2026-10-04
# staging->main promotion (bloom #1043), so the poller closes those scans once the Workflow ends.
# Non-retriable failures and exit codes are unchanged.
# Rollback target: sha-88cbcbf@sha256:0259ec0ad3c6a1cea927a7b28cfc6f20aad42919e43fe4d2767f6430607e3265.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: sleap-roots-write-back-template
  labels:
    project: busch-lab
spec:
  templates:
    - name: write-back
      # CPU-only, I/O-bound (HTTPS calls) — trait-extractor's retry pattern, not predictor's GPU one.
      priorityClassName: interactive-preemptible
      retryStrategy:
        # See sleap-roots-images-downloader-template.yaml for why retryPolicy is explicit here.
        limit: 2
        retryPolicy: Always
      container:
        image: ghcr.io/salk-harnessing-plants-initiative/bloomctl:sha-5b709d0@sha256:f2c2fb412a4a6ee48477e0b89f762dea70b8ad51f78c367f51cbd218c957e640
        imagePullPolicy: Always
        args:
          - "cyl"
          - "batch-ingest-result"
          - "/workspace/input"
          - "--predictions-dir"
          - "/workspace/predictions"
        env:
          # See sleap-roots-images-downloader-template.yaml for why HOME is set explicitly.
          - name: HOME
            value: /home/bloom
          # See sleap-roots-images-downloader-template.yaml for why ARGO_WORKFLOW_NAME is set.
          - name: ARGO_WORKFLOW_NAME
            value: "{{workflow.name}}"
        volumeMounts:
          - name: traits-output-dir
            mountPath: /workspace/input
          - name: predictions-output-dir
            mountPath: /workspace/predictions
          # Provisioned — see sleap-roots-images-downloader-template.yaml (sleap-roots-pipeline#17,
          # resolved for staging, confirmed working end-to-end on the real cluster).
          - name: bloom-credentials
            mountPath: /home/bloom/.bloom/credentials.txt
            subPath: credentials.txt
            readOnly: true
        # No privileged/runAsUser:0 — see sleap-roots-images-downloader-template.yaml.
        resources:
          requests:
            cpu: "0.5"
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi
