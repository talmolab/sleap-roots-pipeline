# https://argo-workflows.readthedocs.io/en/latest/fields/#workflowspec
# A4: batch stage-in via bloomctl (bloom #532). Image is a commit-sha tag auto-built on bloomcli's
# push to `staging` — no versioned bloomcli release exists yet, so this is the only correct
# reference for now; expect to bump it once a real version tag exists. Digest-pinned since
# 2026-09-29 (`sha-<gitsha>@sha256:<digest>`, the producers' format): a `sha-<gitsha>` tag is
# immutable in *name* only — a re-run of the build workflow against the same commit would silently
# overwrite it in GHCR unless immutable tags are enabled on that package (unverified from this repo)
# — and the digest is what resolves. Keep the tag beside it so the build commit stays readable.
# Bumped 2026-07-30: sha-61959bd (#532) -> sha-c21d11b (bloom #556, fixes #555 — build_sidecar()
# now writes image_ids as str via sleap_roots_contracts.InputRef; scan_is_already_staged() now
# rejects pre-fix int-typed sidecars so already-staged scans re-stage cleanly).
# Bumped 2026-09-15 (#56): sha-3659705 (2026-08-24) -> sha-0614889. Carries BOTH driver-side halves
# #56 needs: bloom#830 (`ctx.exit(0 if result.ok else 3)` — before this, batch-download-for-predict
# had only ctx.exit(1), so there was no partial-success code for the Argo wiring to read) and
# bloom#774 (per-scan status marking + done_count/failed_count, which is what records the
# isolated-failed scan as `failed` at the run level). Digest
# sha256:e39b4746e68b4405d1d91899e358aee5a2badf1a9b8f103cd6971d28881a7cc5.
# NOTE the tag is 7 chars: bloomcli's CI tags `sha-$(git rev-parse --short HEAD)` and its runner
# abbreviates shorter than a local checkout does — `sha-0614889` resolves, `sha-06148896` 404s.
# Verify a bump against GHCR directly; do not derive the tag from a local `git rev-parse --short`.
# Bumped 2026-09-17 (#79): sha-0614889 -> sha-28034f6 (salk-bloom #871, merge commit 28034f6d,
# 2026-09-17 UTC). Digest
# sha256:ee39fd04a250ee533bde24248dfa2b28cd4a23bd0a89614c462d3f11e40d0a7d.
# THIS stage's code (`cyl batch-download-for-predict`) is unchanged by #871 — the bump is here only
# because the lockstep rule requires all three bloomctl pins to move together. The actual fix is in
# write-back; see sleap-roots-write-back-template.yaml for what it changes.
# Applied to the cluster BEFORE this repo caught up: all three templates ran sha-28034f6 live while
# `main` still said sha-0614889, so scripts/check_cluster_drift.sh reported DRIFT on gate,
# images-downloader and write-back until #79 merged. That is the #51/#53 pattern (#58) — while such
# a divergence is open the drift check cannot serve as a gate, because an intended divergence is
# indistinguishable from a real one. Re-derive the current pin from the cluster before using any
# recorded rollback target.
# Bumped 2026-09-29: sha-28034f6 -> sha-1bc3056@sha256:8e9eb22c7cd0ed5f3af45d7393463d3261699032dd8bb8aa4f1899ede250d802
# (salk-bloom #940, squash 1bc3056c: bloomctl adopts sleap-roots-contracts 0.1.0a9; tracking
# bloom#934). The first bloomctl pin to carry a digest. THIS stage's code changes: the writer now
# writes `run_manifest.<ARGO_WORKFLOW_NAME>.json` (whitespace-stripped run id), OVERWRITING it with
# this invocation's ok+skipped keys (no union), and never writes or reads the legacy
# `run_manifest.json` while a run id is set. A run id the contract rejects exits 1 before staging.
# ORDERING: register write-back's matching bump BEFORE this one. `argo template update` is not
# atomic across templates, and this writer paired with the sha-28034f6 write-back ingests the wrong
# envelopes; the reverse pairing is safe. Roll back in the opposite order (this template first).
# The legacy `run_manifest.json` files in the shared input, predictions and traits dirs had to be
# deleted only after both templates were live. Done 2026-09-29: they were run rr4zj's (15 keys;
# not hpdpf's 12 as first written here), snapshotted to a4_poc/_stale-manifests-2026-09-29/.
# RESTORE them from there on any rollback to sha-28034f6.
# Bumped 2026-10-02: sha-1bc3056 -> sha-88cbcbf@sha256:0259ec0ad3c6a1cea927a7b28cfc6f20aad42919e43fe4d2767f6430607e3265
# (salk-bloom #1008, squash 88cbcbf3, bloomctl 0.1.0a7; part of bloom#900 / bloom#875). Digest
# from the docker-build-bloomcli run for 88cbcbf3 and `imagetools inspect` (OCI index, the same
# kind as the sha-1bc3056 digest). THIS stage's code is unchanged; the bump is here for the
# lockstep rule. What changes is write-back's message for an unmatched no-op re-delivery; see
# sleap-roots-write-back-template.yaml. Every bloomcli/ commit on bloom staging since 1bc3056c
# rides along: #976 (57242f36, README only), #982 (a3a3c9d9, version 0.1.0a6 -> 0.1.0a7, PyPI
# README and CHANGELOG), #996 (306ab03a, one test file) and #1008. None changes a CLI flag, the
# sleap-roots-contracts pin (still 0.1.0a9), the run-manifest name or an exit code, so the run
# manifest's writer and reader are the same as at sha-1bc3056 and registration order does not
# matter for this bump. Write-back first anyway, as for the last one.
# Rollback target: sha-1bc3056@sha256:8e9eb22c7cd0ed5f3af45d7393463d3261699032dd8bb8aa4f1899ede250d802
# (all three templates; re-derive the live pin from the cluster first).
# Bumped 2026-10-04: sha-88cbcbf -> sha-5b709d0@sha256:f2c2fb412a4a6ee48477e0b89f762dea70b8ad51f78c367f51cbd218c957e640
# (salk-bloom #1038, squash 5b709d0b, bloomctl 0.1.0a8; part of bloom#1034). Digest from the
# docker-build-bloomcli run for 5b709d0b and `imagetools inspect` (OCI index, the same kind as the
# sha-88cbcbf digest). THIS stage's code is unchanged; the bump is here for the lockstep rule.
# What changes is write-back's retry hand-off; see sleap-roots-write-back-template.yaml. One other
# bloomcli/ commit on bloom staging since 88cbcbf3 rides along: #1002 (8b6c4c7b, version
# 0.1.0a7 -> 0.1.0a8; h5py/numpy move from the `scrna` extra into the base install, which the
# image already installed, so it still carries them; scrna-only code and the PyPI README). None
# changes a cyl CLI flag, the sleap-roots-contracts pin (still 0.1.0a9), the run-manifest name or
# an exit code, so registration order does not matter for this bump. Write-back first anyway, as
# for the last one.
# Rollback target: sha-88cbcbf@sha256:0259ec0ad3c6a1cea927a7b28cfc6f20aad42919e43fe4d2767f6430607e3265
# (all three templates; re-derive the live pin from the cluster first).
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: sleap-roots-images-downloader-template
  labels:
    project: busch-lab
spec:
  templates:
    - name: images-downloader
      # CPU-only, I/O-bound (HTTPS calls) — trait-extractor's retry pattern, not predictor's GPU one.
      priorityClassName: interactive-preemptible
      # #98: at most `pipeline-stage-in` downloader tasks run at once across runai-busch-lab -- the
      # stage where a large trigger's pod flood lands first. Same gate as the predictor's; see the
      # header of sleap-roots-pipeline-semaphores.yaml.
      synchronization:
        semaphores:
          - configMapKeyRef:
              name: sleap-roots-pipeline-semaphores
              key: pipeline-stage-in
      retryStrategy:
        # retryPolicy Always (not just the default OnFailure) matters here: this shares
        # trait-extractor's preemptible priority class, and RunAI eviction under CPU-pool
        # over-quota contention typically surfaces as an Error-phase node, which OnFailure does
        # not retry.
        limit: 2
        retryPolicy: Always
      container:
        image: ghcr.io/salk-harnessing-plants-initiative/bloomctl:sha-5b709d0@sha256:f2c2fb412a4a6ee48477e0b89f762dea70b8ad51f78c367f51cbd218c957e640
        imagePullPolicy: Always
        args:
          - "cyl"
          - "batch-download-for-predict"
          - "/workspace/images_input"
          - "--scan-ids"
          - "{{workflow.parameters.scan-ids}}"
        env:
          # bloomcli's Dockerfile creates its runtime user via `adduser --system` with no explicit
          # home directory, so Python's Path.home() (which bloomctl's credential lookup uses) is
          # ambiguous without this. Setting HOME here makes ~/.bloom/credentials.txt resolve
          # deterministically to the path the bloom-credentials volume below is mounted at.
          - name: HOME
            value: /home/bloom
          # Sourced from Argo's built-in {{workflow.name}} — bloomctl reads this as
          # pipeline_run_id for RunManifest (bloom #653); see sleap-roots-pipeline#38.
          - name: ARGO_WORKFLOW_NAME
            value: "{{workflow.name}}"
        volumeMounts:
          - name: images-input-dir
            mountPath: /workspace/images_input
          # Provisioned (2026-07-29) via the RunAI console as a Generic secret — resolves
          # sleap-roots-pipeline#17 for staging. Confirmed working end-to-end on the real cluster
          # (real auth, real staging) — see the OpenSpec change's design.md/tasks.md.
          - name: bloom-credentials
            mountPath: /home/bloom/.bloom/credentials.txt
            subPath: credentials.txt
            readOnly: true
        # No privileged/runAsUser:0 — unlike predictor/trait-extractor, this genuinely doesn't need
        # it (non-root image, no GPU, no device access).
        resources:
          requests:
            cpu: "0.5"
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi
