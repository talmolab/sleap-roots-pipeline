apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: sleap-roots-predictor-template
  # NOTE: these live on the WorkflowTemplate OBJECT metadata, so Argo does NOT copy them onto the
  # pod — this `preemptible` annotation is an INERT breadcrumb (effective behavior comes from
  # spec.templates[].priorityClassName below). The `gpu-fraction` annotation that used to live
  # here was equally inert and has moved to spec.templates[predictor].metadata.annotations below
  # as `gpu-memory` (pod-level, where Argo actually copies it) — closes #25. See
  # openspec/changes/enable-predictor-gpu-fractions/design.md for the full rationale.
  annotations:
    preemptible: "true"
  labels:
    project: busch-lab
spec:
  templates:
    - name: predictor
      metadata:
        # Pod-level annotation — Argo copies spec.templates[].metadata onto the pod, unlike the
        # WorkflowTemplate object-level metadata above. This is what RunAI's scheduler actually
        # reads. Sized from a measured peak VRAM trace (~4,676 MiB); see design.md.
        annotations:
          gpu-memory: "8192"
      # Explicit per PR #41 review: annotation-only GPU requests have no nvidia.com/gpu fallback,
      # so scheduling depends entirely on RunAI's scheduler seeing this pod. Already automatic in
      # runai-talmo-lab/runai-busch-lab today (live-verified) — set explicitly anyway so a future
      # cluster/namespace config change can't silently regress to the default k8s scheduler with
      # no GPU reservation and no obvious failure signal.
      schedulerName: runai-scheduler
      # RunAI: preemptibility is governed by priorityClassName, NOT the preemptible
      # annotation (a UI breadcrumb). Set to `high` (125, non-preemptible) per cluster-admin
      # guidance 2026-08-06: trait-extractor has no skip-if-done yet (#37), so avoiding
      # eviction-triggered whole-batch recomputation matters more right now than bursting above
      # deserved quota. Cluster admin set this live first; this file was synced to match so a
      # future `argo template update` from this repo doesn't silently revert it. Never remove
      # this field outright — the default is unverifiable with this repo's credentials
      # (`priorityclasses` is cluster-scoped and Forbidden to argo-user), and pods observed with
      # none resolved to priority 0, the lowest tier. This file previously recorded "very-high
      # (150)"; that was never verified and is very likely wrong — see the exit-gate template.
      priorityClassName: high
      retryStrategy:
        # Preemptible GPU stage — can be evicted mid-run when over-quota, so allow several
        # retries with backoff (don't slam straight back into a still-full cluster).
        # Resume behaviour (corrected 2026-09-16 — this comment previously claimed predict's skip
        # was "existence-only", so a mid-write eviction could leave a truncated
        # {scan}.predictions.json that a retry trusts as "done". That is FALSE since predict #35:
        # `_previous_identity_key` recomputes an idempotency key from the on-disk sidecar and
        # PredictionManifest and returns None on OSError/JSONDecodeError/ValidationError, so a
        # truncated manifest is treated as CHANGED and re-predicted, never as done.)
        # The real consequence to know about: that key includes `predict_code_sha`, baked into this
        # image as SRP_PREDICT_CODE_SHA. So bumping the pin below legitimately invalidates every
        # already-computed scan's key and the next run recomputes them all — expected, not a bug,
        # but it means a "were leftovers left untouched?" check cannot be run across a pin bump.
        limit: 3
        retryPolicy: Always
        backoff:
          duration: "2m"
          factor: 2
      container:
        # A4: warm-batch GHCR predict (predict #27, merged main 4a70e599 — closes predict #24).
        # Models load in-process from the wandb registry — no models-input mount. Contract:
        # `<image> <in_dir> <out_dir>` + WANDB_API_KEY. Bakes SRP_PREDICT_CODE_SHA → non-empty
        # predict_code_sha (idempotency-key input).
        # Bumped 2026-09-10 (#54): the previous pin (4a70e599, 2026-07-07) predated predict's own
        # RunManifest consumption (predict#35, merged 08-18) and Argo exit-semantics hardening
        # (predict#36/#38) by 6 weeks — same class of bug as #51/#55.
        # Bumped 2026-09-15 (#56): sha-f974632... -> sha-e025e309..., the fourth bump for this
        # template. Carries predict#42 (`copy_run_manifest_forward`), which forwards
        # run_manifest.json into predict's own output so trait-extraction is run-scoped — the real
        # reason #54/#55's fix alone did not stop leftover-scan contamination. #57's pin predated
        # #42 by definition. NOTE predict tags the FULL 40-char sha, unlike bloomctl's 7 —
        # verify against GHCR, don't pattern-match the other templates.
        # Watch out (predict#44): predict still forwards the manifest unchanged rather than
        # narrowing it to `ok ∪ skipped`. Now that #56 lets the DAG reach traits after a partial
        # predict, a predict-failed scan becomes a misattributed *trait-extraction* failure.
        # Digest-pinned 2026-09-16 (#70). The tag names a commit; only the digest names bytes --
        # a `sha-<gitsha>` tag is immutable in NAME only, and a rebuild of the same commit can
        # silently overwrite it in GHCR. The digest below is the source of truth for
        # SRP_PREDICT_CONTAINER_DIGEST in `env:`; `scripts/check_manifests.py` fails if they drift.
        # Bumped 2026-09-24 (predict#45, part of predict#34): sha-e025e309... -> sha-9ac819fb...
        # (predict main; code-identical to the #45 squash 87ca271 -- 9ac819f only archives the
        # OpenSpec change). Carries contracts ==0.1.0a9: predict now reads ONLY selector-shaped
        # ModelCards, so this bump was gated on training's re-seed (update-model-card-selectors 6.2:
        # 8 selector-shaped production collections, verified 2026-09-24; record in
        # talmolab/sleap-roots-training@dc216c7 docs/migration/). Not gated on Bloom accepting a9:
        # predict never stamps contract_version, and nothing predict writes changed a7 -> a9.
        # No readable card, an empty catalog, a missing WANDB_API_KEY, or a registry error now exits
        # 1 (was 3) at catalog load -- before the first scan is predicted, but AFTER the
        # run_manifest.json forward-copy, so continueOn still runs traits/write-back and the exit
        # gate then fails the run. retryPolicy: Always retries that exit 1 like any failure (~4
        # attempts / ~14m for a misconfiguration); keep it -- it is now also how a transient
        # registry error recovers.
        # First run after this bump: registry_id, version AND predict_code_sha all changed, so every
        # scan in the (accumulated) run manifest fully recomputes once, and every per-root .slp is
        # renamed once (the model slug embeds registry_id). Re-baseline the A4 "re-run a done batch
        # -> 0 GPU pods" oracle AFTER that run, never across it.
        # Rollback BEFORE training 6.3 retires the 13 flat collections: re-pin sha-e025e309...
        # @sha256:4d4064c6... (tag, digest AND SRP_PREDICT_CONTAINER_DIGEST together). AFTER 6.3 an
        # image-only rollback is SILENT -- the old image skips every selector-shaped card and exits
        # 3, which the exit gate passes -- so restore `production` on the flat collections first,
        # from training's 6.0(a) snapshot (dc216c7 docs/migration/2026-09-22-pre-reseed-baseline.json).
        # Bumped 2026-09-25 (predict#47, #71's predict reader): sha-9ac819fb... -> sha-9a6f20c0...
        # (predict main; code-identical to the #47 squash 9f39691 -- 9a6f20c only archives the
        # OpenSpec change). Predict now resolves its scope through contracts'
        # load_run_manifest(allow_legacy=True): run_manifest.<ARGO_WORKFLOW_NAME>.json first, then
        # the legacy run_manifest.json, and forwards the manifest under the name it read. The
        # fleet's writer still publishes only the legacy file, so scoping, forwarding and exit
        # codes are unchanged; the new log line is a warning when the legacy file names another
        # run (another workflow merged into the shared directory after this one). One exit change:
        # a missing manifest under a known ARGO_WORKFLOW_NAME now exits 1 instead of falling back
        # to unscoped discovery. The bloomctl writer flip must come AFTER this deploy (and traits'
        # and ingest's dual-read); once it lands, this image is the rollback floor -- 9ac819fb
        # reads only run_manifest.json, and without it falls back to unscoped discovery.
        # First run after this bump: predict_code_sha changed (SRP_PREDICT_CODE_SHA is baked from
        # the build sha), so every scan in the accumulated run manifest fully recomputes once, as
        # at the 09-24 bump. Re-baseline the A4 "0 GPU pods" oracle AFTER that run.
        # Rollback: re-pin sha-9ac819fb...@sha256:005b0abe... (tag, digest AND
        # SRP_PREDICT_CONTAINER_DIGEST together) -- safe only while the writer is legacy-only.
        image: ghcr.io/talmolab/sleap-roots-predict:sha-9a6f20c00762e327b9aea39c8e06a81443252d01@sha256:afc8da823838bff85d93013e85b8d0c18c2d4f01117a0914944df1a845c73adc
        imagePullPolicy: Always
        args:
          - "/workspace/images_input"
          - "/workspace/output"
        env:
          # #56 carried this before predict read it; since predict#47 (pinned 2026-09-25) it is
          # NOT inert. predict reads it through contracts' pipeline_run_id_from_env() as the run
          # identity: it selects run_manifest.<name>.json ahead of the legacy file, makes a missing
          # manifest exit 1 instead of scanning everything, and triggers the "legacy manifest names
          # another run" warning. The stage directories are fixed, shared hostPaths, and the legacy
          # run_manifest.json accumulates scan_keys across every run (and every environment)
          # writing into them, so without this identity predict cannot tell its own scope from
          # another run's. Removing it silently reverts predict to legacy-only reads (and to unscoped
          # discovery when run_manifest.json is absent).
          - name: ARGO_WORKFLOW_NAME
            value: "{{workflow.name}}"
          # #70: NOT inert -- predict reads this today (`sleap_roots_predict/output_contract.py`,
          # resolve_identity(..., "SRP_PREDICT_CONTAINER_DIGEST")), falling back to "" when unset,
          # which is why every envelope recorded predict_code_sha but not the image. The value MUST
          # equal the digest pinned on this file's own `image:` line; check_manifests.py enforces
          # that and derives the expected value by parsing that line, so nothing is hardcoded.
          # At every future pin bump, re-verify against the registry before editing either line:
          #   TOK=$(curl -s "https://ghcr.io/token?scope=repository:talmolab/sleap-roots-predict:pull&service=ghcr.io" | python -c 'import sys,json;print(json.load(sys.stdin)["token"])')
          #   curl -sI -H "Authorization: Bearer $TOK" -H "Accept: application/vnd.oci.image.index.v1+json" \
          #     https://ghcr.io/v2/talmolab/sleap-roots-predict/manifests/<tag> | grep -i docker-content-digest
          # Not an idempotency-key input, so changing it forces no recompute.
          - name: SRP_PREDICT_CONTAINER_DIGEST
            value: "sha256:afc8da823838bff85d93013e85b8d0c18c2d4f01117a0914944df1a845c73adc"
          - name: WANDB_API_KEY
            valueFrom:
              secretKeyRef:
                # RunAI UI "Generic secret" credentials materialize the k8s secret with a
                # `genericsecret-` prefix on the asset name (asset `wandb-api-key` ->
                # secret `genericsecret-wandb-api-key`), Project-scoped into this namespace.
                name: genericsecret-wandb-api-key
                key: WANDB_API_KEY
        volumeMounts:
          - name: images-input-dir
            mountPath: /workspace/images_input
          - name: predictions-output-dir
            mountPath: /workspace/output
        # securityContext removed (#25): privileged:true/runAsUser:0 confirmed unnecessary via a
        # live test run — GPU is visible via device-plugin without privileged, and NFS writes
        # succeeded as the default non-root user. NOTE (corrected #70): this comment previously
        # claimed cluster admission "rejects `privileged` outright". That is overbroad — the
        # source claim (2026-08-04-gpu-fraction-sizing-design.md) scopes it to
        # `runai workspace submit`, the RunAI CLI path, NOT Argo-created pods. Falsified live:
        # the trait-extractor template still sets `privileged: true`/`runAsUser: 0` and its pods
        # run and Succeed in this namespace. Dropping it here was justified by the test run
        # above, not by admission. See design.md's Risks section for the one caveat (that test
        # reused an already-writable path, not a fresh one — task 3.4 covers the fresh-path case).
        resources:
          # Initial estimates — tune from a real run (predict loads sleap-nn models into RAM).
          # A memory request/limit prevents an unaccounted OOM-kill under node pressure. No
          # nvidia.com/gpu here (#25) — GPU comes from the gpu-memory annotation above; RunAI's
          # own docs example for annotation-driven GPU requests carries no nvidia.com/gpu resource
          # at all, and coexistence with it is what caused #25 in the first place.
          requests:
            cpu: "2"
            memory: 8Gi
          limits:
            memory: 24Gi
